[project]
name = "jobshift-api"
version = "0.1.0"
description = "JobShift anonymous task inventory API; analysis engines intentionally unimplemented"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "sqlalchemy>=2.0.40,<3",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1.5,<4",
  "reportlab>=4.4,<5",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
